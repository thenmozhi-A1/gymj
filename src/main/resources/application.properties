# Use environment variables for production, fallback to Aiven for dev
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-1634e0bf-thenmozhiayothi-2556.i.aivencloud.com:27975/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:<YOUR_AIVEN_PASSWORD_HERE>}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pooling Optimizations
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Server Port (Render uses PORT env var)
server.port=${PORT:8080}

# CORS (allow React frontend)
spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

